[project]
name = "sql-rag-assistant"
version = "0.1.0"
description = "Enterprise-grade AI SQL RAG Assistant - natural language to SQL with RAG-grounded context, validation, and AI-generated insights."
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    # --- Web framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # --- Database / ORM ---
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.13.3",
    "aiomysql>=0.2.0",
    "pymysql>=1.1.1",

    # --- Auth ---
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",  # pinned: passlib 1.7.4's version probe breaks on bcrypt>=4.1
    "python-multipart>=0.0.12",

    # --- LLM / RAG ---
    "langchain>=0.3.7",
    "langchain-community>=0.3.5",
    "groq>=0.11.0",
    "faiss-cpu>=1.9.0",
    "sentence-transformers>=3.2.1",

    # --- Caching ---
    "redis>=5.1.1",

    # --- Visualization ---
    "plotly>=5.24.1",
    "pandas>=2.2.3",

    # --- Frontend ---
    "streamlit>=1.39.0",

    # --- Logging / Config ---
    "loguru>=0.7.2",
    "python-dotenv>=1.0.1",

    # --- Utilities ---
    "tenacity>=9.0.0",
    "sqlparse>=0.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.2",
    "ruff>=0.7.1",
    "mypy>=1.13.0",
    "faker>=30.8.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-report=html"
